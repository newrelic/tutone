---
# Reference config for generating terraform-provider-newrelic resources with tutone.
# Drop this file at the root of terraform-provider-newrelic as .tutone.yml and update
# templateDir to the absolute path of tutone's templates/terraform directory.
#
# Usage:
#   export NEW_RELIC_API_KEY=<your-key>
#   tutone fetch -s schema.json -c .tutone.yml
#   tutone generate --config .tutone.yml --package alertmutingrule
#   tutone generate --config .tutone.yml --package pathpoint

log_level: info

cache:
  schema_file: schema.json

endpoint: https://api.newrelic.com/graphql

auth:
  header: Api-Key
  api_key_env_var: NEW_RELIC_API_KEY

generators:
  - name: terraform
    # Update this path to point at your local tutone checkout.
    templateDir: /path/to/tutone/templates/terraform

packages:

  - name: alertmutingrule
    path: newrelic/
    generators:
      - terraform
    mutations:
      - name: alertsMutingRuleCreate
        max_query_field_depth: 4
      - name: alertsMutingRuleUpdate
        max_query_field_depth: 4
      - name: alertsMutingRuleDelete
        max_query_field_depth: 2
    terraform:
      resource_name: alert_muting_rule
      create_method: CreateMutingRuleWithContext
      update_method: UpdateMutingRuleWithContext
      delete_method: DeleteMutingRuleWithContext
      read_method:   GetMutingRuleWithContext
      id_type:       int
      id_fields:     [account_id, id]
      requires_account_id: true
      computed_fields:  [account_id]
      build_tags: [integration, unit, ALERTS]
      client_packages:
        - github.com/newrelic/newrelic-client-go/v2/pkg/alerts

  - name: pathpoint
    path: newrelic/
    generators:
      - terraform
    mutations:
      - name: pathPointCreate
        max_query_field_depth: 8
      - name: pathPointUpdate
        max_query_field_depth: 8
      - name: pathPointDelete
        max_query_field_depth: 2
    terraform:
      resource_name: pathpoint_flow
      create_method: PathPointCreate
      update_method: PathPointUpdate
      delete_method: PathPointDelete
      read_method:   GetFlow
      client_accessor: PathPoint
      id_type:        string
      id_result_field: GUID
      id_cast_type:   pathpoint.EntityGUID
      requires_account_id: true
      create_inputs:
        - arg: pathpoint
          type: PathPointFlowInput
          source: nested_block
        - arg: scope
          type: PathPointScopeInput
          source: nested_block
      crud_args:
        create: [pathpoint, scope]
        read:   [account_id, id]
        update: [id, input]
        delete: [id]
      import_example: "MjUyMDUyOHxBUE18QVBQTElDQVRJT058MjE1MDM3Nzk1"
      build_tags: [integration, unit, PATHPOINT]
      client_packages:
        - github.com/newrelic/newrelic-client-go/v2/pkg/pathpoint
